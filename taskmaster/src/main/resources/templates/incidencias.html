<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Incidencias</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <div class="container py-4">

        <!-- Cabecera y botón para nueva incidencia -->
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1 class="h2 mb-0">Gestión de Incidencias</h1>
            <a th:href="@{/incidencias/nueva}" class="btn btn-primary">+ Nueva Incidencia</a>
        </div>

        <!-- Zona para mensaje flash/alerta -->
        <div class="alert alert-success alert-dismissible fade show" role="alert" th:if="${mensaje != null}">
			<span th:text="${mensaje}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Cerrar"></button>
        </div>

        <!-- Filtro por gravedad -->
        <div class="card mb-4 shadow-sm">
            <div class="card-body">
                <form th:action="@{/incidencias}" method="get" class="row g-3 align-items-center">
                    <div class="col-auto">
                        <label for="gravedad" class="col-form-label fw-bold">Filtrar por gravedad:</label>
                    </div>
                    <div class="col-auto">
                        <select name="gravedad" id="gravedad" class="form-select">
                            <option value="" th:selected="${gravedadFiltro == null or gravedadFiltro == ''}">Todas</option>
                            <option value="BAJA" th:selected="${gravedadFiltro == 'BAJA'}">Baja</option>
                            <option value="MODERADA" th:selected="${gravedadFiltro == 'MODERADA'}">Moderada</option>
                            <option value="ALTA" th:selected="${gravedadFiltro == 'ALTA'}">Alta</option>
							<option value="CRÍTICA" th:selected="${gravedadFiltro == 'CRÍTICA'}">Crítica</option>
                        </select>
                    </div>
                    <div class="col-auto">
                        <button type="submit" class="btn btn-outline-secondary">Filtrar</button>
                        <a th:href="@{/incidencias}" class="btn btn-link text-decoration-none">Limpiar</a>
                    </div>
                </form>
            </div>
        </div>

        <!-- Tabla de incidencias -->
        <div class="card shadow-sm">
            <div class="table-responsive">
                <table class="table table-hover table-striped align-middle mb-0">
                    <thead class="table-dark">
                        <tr>
                            <th>ID</th>
                            <th>Título</th>
                            <th>Aula</th>
                            <th>Gravedad</th>
                            <th>Estado</th>
                            <th class="text-center">Acciones</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- Fila de ejemplo / prototipo -->
                        <tr th:each="incidencia : ${listadoIncidencias}">
                            <td class="fw-semibold" th:text="${incidencia.id}"></td>
                            <td th:text="${incidencia.titulo}"></td>
                            <td th:text="${incidencia.aula}"></td>
                            <td>
								<span class="badge"
								th:classappend="${incidencia.gravedad == 'CRÍTICA' ? 'bg-danger' : 'bg-secondary'}"
								th:text="${incidencia.gravedad}"></span>
                            </td>
                            <td>
                                <span class="badge bg-secondary" th:text="${incidencia.resuelta ? 'Resuelta' : 'Pendiente'}"></span>
                            </td>
                            <td class="text-center">
                                <a th:href="@{/incidencias/id/{idIncidencia}
								(idIncidencia=${incidencia.id})}" class="btn btn-sm btn-outline-primary">Ver Detalle</a>
                            </td>
                        </tr>

                        <!-- Mensaje en caso de tabla vacía -->
                        <tr th:if="${#lists.isEmpty(listadoIncidencias)}">
                            <td colspan="6" class="text-center py-4 text-muted">
                                No hay incidencias registradas.
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

    </div>
	
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
