<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Nueva incidencia</title>
</head>
<body>
	
	<h1>Nueva incidencia</h1>
	<p th:if="${error != null}" th:text="${error}"></p>
	
	<form th:action="@{/incidencias/guardar}" method="post">
	    <!-- Aquí añadiremos los campos del id -->
		<label for="id">ID:</label>
		<input type="text" name="id" id="id" required>
		<!-- Aquí añadiremos los campos del titulo-->
		<label for="titulo">Título:</label>
		<input type="text" name="titulo" id="titulo" required>
		
		<label for="descripcion">Descripción</label>
		<textarea name="descripcion" id="descripcion"></textarea>
		
		<label for="aula">Aula:</label>
		<input type="text" id="aula" name="aula">
		
		<label for="gravedad">Gravedad:</label>
		<select id="gravedad" name="gravedad">
		  <option value="BAJA">BAJA</option>
		  <option value="MODERADA">MODERADA</option>
		  <option value="ALTA">ALTA</option>
		  <option value="CRÍTICA">CRÍTICA</option>
		</select>
		
		<button type="submit">Guardar incidencia</button>
	</form>
</body>
</html>
